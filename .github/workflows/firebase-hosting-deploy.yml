name: Deploy to Firebase Hosting

# Auto-deploy the app to mathgrain.com (Firebase Hosting, project vica-domino)
# on every push to the canonical branch. ship.sh pushes HEAD to all 3 mirrors,
# but we deploy from ONE branch only so a single push = a single deploy.
#
# ONE-TIME SETUP (Victor): add a repo secret named FIREBASE_SERVICE_ACCOUNT_VICA_DOMINO
# whose value is the full JSON of a Firebase service-account key
# (Firebase console → Project Settings → Service accounts → Generate new private key).
# See docs/PUBLISHING_PLAN.md.

on:
  push:
    branches:
      - claude/review-project-docs-JOOeh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VICA_DOMINO }}
          projectId: vica-domino
          channelId: live
